[pytest]
; tests/ and old_tests/ both exist (old_tests/ predates a later reorganization
; and still covers real ground tests/ doesn't replicate — provider-level tests
; for Gemini/Groq/Mistral/Ollama, planner, quality, workflow e2e, semantic
; matcher). Several basenames collide across the two directories
; (test_chunker.py, test_evidence.py, test_writer.py, ...). Neither directory
; is a package (no __init__.py), so pytest's default rootdir-based import
; mode treats same-named modules across them as a single global name and
; fails to collect either. importlib mode imports each test file by its
; actual file path instead, so identically-named modules in different
; directories no longer collide — no test file needs to move or be deleted.
addopts = --import-mode=importlib
